# База знань барбершопу — ЄДИНЕ джерело правди для бота.
# Бот відповідає тільки на основі цього файлу. Чого тут немає — бот не знає
# і передає питання адміністратору.
#
# Демо-бізнес: вигаданий. Збіги з реальними закладами випадкові.

business:
  name: "Барбершоп «Бритва»"
  description: "Чоловічі стрижки, оформлення бороди та гоління небезпечною бритвою."
  city: "Київ"
  address: "вул. Демонстраційна, 7 (вхід з двору, зелені двері)"
  landmark: "5 хвилин пішки від метро «Лук'янівська»"
  phone: "+380 00 000 00 00"
  instagram: "@brytva.demo"
  languages: ["українська", "англійська"]

schedule:
  timezone: "Europe/Kyiv"
  regular:
    monday:    "10:00–20:00"
    tuesday:   "10:00–20:00"
    wednesday: "10:00–20:00"
    thursday:  "10:00–20:00"
    friday:    "10:00–21:00"
    saturday:  "10:00–21:00"
    sunday:    "11:00–18:00"
  last_booking: "Останній запис — за 1 годину до закриття."
  # Винятки: свята, санітарні дні. Бот має їх враховувати.
  exceptions:
    - date: "2026-12-31"
      hours: "10:00–16:00"
    - date: "2027-01-01"
      hours: "вихідний"

# Рівень майстра впливає на ціну. Це типова схема в барбершопах,
# і хороший тест: бот має пояснити, чому одна послуга коштує по-різному.
masters:
  - name: "Андрій"
    level: "топ-барбер"
    experience_years: 8
    specialty: "класичні стрижки, королівське гоління"   # назви — точно як у services
    works: "вівторок–субота"
  - name: "Дмитро"
    level: "барбер"
    experience_years: 4
    specialty: "фейди, сучасні стрижки"
    works: "понеділок–п'ятниця, неділя"
  - name: "Олег"
    level: "барбер"
    experience_years: 3
    specialty: "дитячі стрижки, стрижка машинкою"
    works: "вівторок–неділя"

services:
  # price: {рівень_майстра: ціна в гривнях}; duration — у хвилинах
  - name: "Чоловіча стрижка"
    price: {барбер: 650, топ-барбер: 850}
    duration: 60
  - name: "Стрижка машинкою (одна насадка)"
    price: {барбер: 400, топ-барбер: 500}
    duration: 30
  - name: "Оформлення бороди"
    price: {барбер: 450, топ-барбер: 550}
    duration: 40
  - name: "Стрижка + борода"
    price: {барбер: 1000, топ-барбер: 1300}
    duration: 90
  - name: "Королівське гоління (небезпечною бритвою, гарячий рушник)"
    price: {топ-барбер: 700}
    duration: 45
    note: "Виконує лише топ-барбер Андрій."
  - name: "Дитяча стрижка (до 12 років)"
    price: {барбер: 450}
    duration: 40
    note: "Виконує Олег."
  - name: "Камуфляж сивини"
    price: {барбер: 400, топ-барбер: 450}
    duration: 30

booking:
  how: "Запис через адміністратора: у цьому боті (кнопка «Записатися») або за телефоном."
  prepayment: "Передоплата не потрібна."
  cancellation: "Скасувати або перенести запис — не пізніше ніж за 3 години."
  late: "Запізнення понад 15 хвилин — запис може бути скасовано, якщо в майстра наступний клієнт."
  walk_in: "Без запису — лише якщо є вільне вікно, краще уточнити заздалегідь."

payment:
  methods: ["готівка", "картка", "Apple Pay / Google Pay"]

amenities:
  - "Кава, чай або вода — безкоштовно."
  - "Wi-Fi для клієнтів."
  - "Парковка: безкоштовна у дворі, 4 місця."
  - "Можна з собакою, якщо вона спокійна."

faq:
  - q: "Чи можна прийти з дитиною?"
    a: "Так, дитячі стрижки для дітей до 12 років робить Олег. Дитина має бути з дорослим."
  - q: "Чи стрижете жінок?"
    a: "Ні, ми спеціалізуємося лише на чоловічих стрижках."
  - q: "Скільки триває стрижка?"
    a: "Звичайна чоловіча стрижка — близько години, стрижка машинкою — пів години."
  - q: "Чи фарбуєте волосся?"
    a: "Ні, фарбування волосся ми не робимо. Є лише камуфляж сивини — тонування сивого волосся."
  - q: "Чи продаєте засоби для укладки?"
    a: "Так, на ресепшені є віск, глина та олія для бороди. Асортимент і ціни уточнює адміністратор."

# Навмисні «білі плями» для тесту анти-вигадування (крок 8).
# Цієї інформації немає ВЗАГАЛІ — бот має чесно сказати, що не знає, і передати адміну:
#   - подарункові сертифікати
#   - знижки, акції, програма лояльності
#   - видалення волосся воском, масаж голови
#   - конкретні вільні вікна на сьогодні (бот не бачить розклад записів)

# Коли бот ЗАВЖДИ передає розмову людині, навіть якщо знає відповідь
handoff_rules:
  - "Клієнт просить живу людину / адміністратора."
  - "Клієнт хоче записатися, перенести або скасувати запис."
  - "Скарга або конфлікт."
  - "Питання, відповіді на яке немає в цьому файлі."
